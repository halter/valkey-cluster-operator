apiVersion: cache.halter.io/v1alpha1
kind: ValkeyCluster
metadata:
  labels:
    app.kubernetes.io/name: valkey-cluster-operator
    app.kubernetes.io/managed-by: kustomize
  name: valkeycluster-sample
spec:
  image: ghcr.io/halter/valkey-server:8.0.2
  nodeSelector:
    halter/nodegroupname: valkey
  shards: 1
  replicas: 1
  minReadySeconds: 10
  resources:
    limits:
      cpu: "0.8"
      memory: 714Mi
    requests:
      cpu: "0.4"
      memory: 714Mi
  # Disk size is managed automatically: volumes start at 1Gi and grow as disk
  # usage increases. storage itself is optional and only needed to pick a
  # storage class or access mode; storageLimit caps the automatic growth.
  storage:
    accessModes:
    - ReadWriteOnce
    storageClassName: gp3
  storageLimit: 100Gi
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: valkeyGroup
